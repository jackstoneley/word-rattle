name: Android app

on:
  push:
    branches: [main]
    paths: ["index.html", "shell.js", "games/**", "android-app/**", "tools/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the site was built before committing
        run: |
          python3 tools/build.py
          if ! git diff --quiet; then
            echo "::error::Run 'python3 tools/build.py' and commit the result. These files were out of date:"
            git diff --stat
            exit 1
          fi

      - name: Install
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        working-directory: android-app
        run: node scripts/prepare-www.js

      - name: Create Android project
        working-directory: android-app
        run: npx cap add android

      - name: Add native features
        working-directory: android-app
        run: node scripts/patch-android.js
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Sync
        working-directory: android-app
        run: npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk stoneley-games.apk
          cp stoneley-games.apk word-rattle.apk
          gh release delete latest --yes --cleanup-tag || true
          NOTE=$(jq -r '.notes | max_by(.id) | "**" + .headline + "**\n\n" + (.details | map("- " + .) | join("\n"))' release-notes.json)
          printf '%b\n\nInstall: on your phone, download stoneley-games.apk and open it. After that, the app updates itself (word-rattle.apk is the same file, kept for old links).\n' "$NOTE" > notes.md
          gh release create latest stoneley-games.apk word-rattle.apk \
            --title "Stoneley Games for Android (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --latest
